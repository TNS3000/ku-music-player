<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>VEGEKUL MUSIC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --leaf:       #2f7d3f;
  --deep:       #1f5a2c;
  --darker:     #143d1f;
  --sprout:     #a8d49a;
  --cream:      #f4f1e8;
  --ink:        #1d241c;
  --ink-soft:   #5a6356;
  --carrot:     #e3742a;
  --vinyl-dark: #181d18;
  --ff-serif:   'Fraunces', Georgia, serif;
  --ff-sans:    'Zen Kaku Gothic New', sans-serif;
}

html, body {
  height: 100%;
  font-family: var(--ff-sans);
  color: var(--ink);
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}

body {
  background: linear-gradient(155deg, var(--leaf) 0%, #235f30 45%, var(--darker) 100%);
  position: relative;
}

/* 上部の若葉色の光 */
body::before {
  content: '';
  position: fixed;
  top: -18%;
  left: 50%;
  transform: translateX(-50%);
  width: min(700px, 110vw);
  height: 55%;
  background: radial-gradient(ellipse, rgba(168,212,154,.35) 0%, transparent 68%);
  pointer-events: none;
  z-index: 0;
}

/* ドット模様テクスチャ */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: radial-gradient(circle, rgba(255,255,255,.07) 1px, transparent 1px);
  background-size: 22px 22px;
  pointer-events: none;
  z-index: 0;
}

/* ====== ページ中央寄せ ====== */
.page {
  min-height: 100dvh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  position: relative;
  z-index: 1;
}

/* ====== カード ====== */
.card {
  width: 100%;
  max-width: 430px;
  min-height: 100dvh;
  background: var(--cream);
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

/* デスクトップ：浮かせたカード */
@media (min-width: 500px) {
  .page {
    align-items: center;
    padding: 48px 20px;
  }
  .card {
    min-height: auto;
    border-radius: 24px;
    box-shadow:
      0 40px 80px rgba(0,0,0,.38),
      0 12px 32px rgba(0,0,0,.22),
      0 2px 8px  rgba(0,0,0,.12);
    overflow: hidden;
  }
}

/* ====== 上部バー ====== */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 20px 12px;
  flex-shrink: 0;
}
.topbar-left {
  display: flex;
  align-items: center;
  gap: 8px;
}

.zone-pill {
  display: flex;
  align-items: center;
  gap: 7px;
  background: var(--leaf);
  color: var(--cream);
  border: none;
  border-radius: 100px;
  padding: 8px 12px 8px 11px;
  cursor: pointer;
  font-family: var(--ff-sans);
  transition: background 0.15s;
  -webkit-appearance: none;
}
.zone-pill:active { background: var(--deep); }

.pill-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(244,241,232,.7);
  flex-shrink: 0;
}
.pill-text {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.04em;
  white-space: nowrap;
}
.pill-chevron {
  color: rgba(244,241,232,.55);
  flex-shrink: 0;
}

.mode-badge {
  font-size: 10px;
  font-weight: 700;
  color: var(--ink-soft);
  letter-spacing: 0.08em;
  padding: 3px 8px;
  border: 1px solid rgba(29,36,28,.16);
  border-radius: 100px;
  user-select: none;
}

.clock {
  font-size: 15px;
  font-weight: 500;
  color: rgba(29,36,28,.4);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.02em;
}

/* ====== プレイヤー本体 ====== */
.player-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 8px 28px 48px;
}

/* ====== ビニールレコード ====== */
.vinyl-wrap {
  position: relative;
  width: min(280px, 72vw);
  height: min(280px, 72vw);
  margin-bottom: 32px;
  flex-shrink: 0;
}

.vinyl {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: var(--vinyl-dark);
  background-image: repeating-radial-gradient(
    circle at center,
    transparent 0px,
    transparent 8px,
    rgba(255,255,255,.02) 8px,
    rgba(255,255,255,.02) 9px
  );
  position: relative;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.05),
    0 20px 60px rgba(0,0,0,.42),
    0 6px 20px rgba(0,0,0,.28);
  animation: vinyl-spin 8s linear infinite;
  animation-play-state: paused;
}
.vinyl.playing { animation-play-state: running; }

@keyframes vinyl-spin { to { transform: rotate(360deg); } }

.vinyl::before {
  content: '';
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.035);
  pointer-events: none;
}

/* ====== レーベル（センター円） ====== */
.vinyl-label {
  position: absolute;
  width: 42%;
  height: 42%;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  overflow: hidden;
  background: radial-gradient(circle at 50% 36%, var(--sprout), var(--leaf) 52%, var(--deep));
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 12px rgba(0,0,0,.5);
  background-size: cover;
  background-position: center;
}
.vinyl-label.has-art .label-text { display: none; }

.label-text {
  text-align: center;
  padding: 6px;
  pointer-events: none;
}
.label-name {
  font-family: var(--ff-serif);
  font-style: italic;
  font-size: 9px;
  color: var(--cream);
  letter-spacing: 0.02em;
  line-height: 1.3;
  white-space: nowrap;
}

/* スピンドル */
.vinyl-spindle {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--vinyl-dark);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 0 1.5px rgba(255,255,255,.12), 0 1px 3px rgba(0,0,0,.5);
  z-index: 2;
}

/* ====== BPM表示 ====== */
.bpm-section {
  text-align: center;
  margin-bottom: 30px;
  width: 100%;
}
.bpm-row {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 5px;
  margin-bottom: 6px;
}
.bpm-num {
  font-family: var(--ff-serif);
  font-size: clamp(44px, 11vw, 56px);
  font-weight: 600;
  color: var(--deep);
  letter-spacing: -0.02em;
  line-height: 1;
}
.bpm-unit {
  font-family: var(--ff-serif);
  font-style: italic;
  font-size: clamp(15px, 3.5vw, 19px);
  color: var(--deep);
  opacity: 0.5;
  font-weight: 400;
  padding-bottom: 4px;
}
.bpm-label {
  font-size: 9px;
  letter-spacing: 0.2em;
  color: rgba(29,36,28,.32);
  font-weight: 700;
  text-transform: uppercase;
}

/* ====== プログレスバー ====== */
.progress-section {
  width: 100%;
  max-width: 310px;
  margin-bottom: 40px;
}
.prog-bar {
  width: 100%;
  height: 3px;
  background: rgba(29,36,28,.1);
  border-radius: 2px;
  cursor: pointer;
  margin-bottom: 9px;
  position: relative;
}
.prog-fill {
  height: 100%;
  background: var(--leaf);
  border-radius: 2px;
  width: 0%;
  transition: width 0.5s linear;
  position: relative;
}
.prog-fill::after {
  content: '';
  position: absolute;
  right: -5px;
  top: 50%;
  transform: translateY(-50%);
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--leaf);
  opacity: 0;
  transition: opacity 0.2s;
}
.prog-bar:hover .prog-fill::after { opacity: 1; }

.time-row {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: rgba(29,36,28,.38);
  font-variant-numeric: tabular-nums;
}

/* ====== コントロール ====== */
.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 36px;
}
.ctrl-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: rgba(29,36,28,.38);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  border-radius: 50%;
  transition: color 0.15s, background 0.15s;
  -webkit-appearance: none;
}
.ctrl-btn:active {
  color: var(--ink);
  background: rgba(29,36,28,.07);
}
.play-btn {
  width: 68px;
  height: 68px;
  border-radius: 50%;
  background: var(--ink);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--cream);
  transition: transform 0.1s, background 0.15s;
  -webkit-appearance: none;
  box-shadow: 0 6px 24px rgba(29,36,28,.22);
  flex-shrink: 0;
}
.play-btn:active { transform: scale(0.92); }
.like-btn.liked { color: #e05a5a; }
.like-btn.liked:active { color: #c03a3a; background: rgba(224,90,90,.1); }

/* ====== シートオーバーレイ ====== */
.sheet-overlay {
  position: fixed;
  inset: 0;
  background: rgba(14,30,14,.52);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
  z-index: 10;
}
.sheet-overlay.open {
  opacity: 1;
  pointer-events: all;
}

/* ====== ゾーン選択シート ====== */
.zone-sheet {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%) translateY(100%);
  width: min(430px, 100vw);
  background: var(--cream);
  border-radius: 20px 20px 0 0;
  padding-bottom: max(env(safe-area-inset-bottom, 0px), 16px);
  transition: transform 0.36s cubic-bezier(0.32, 0.72, 0, 1);
  z-index: 11;
  max-height: 82dvh;
  overflow-y: auto;
}
.zone-sheet.open { transform: translateX(-50%) translateY(0); }

.sheet-handle-wrap {
  display: flex;
  justify-content: center;
  padding: 12px 0 2px;
}
.sheet-handle {
  width: 36px;
  height: 4px;
  background: rgba(29,36,28,.14);
  border-radius: 2px;
}

.sheet-inner { padding: 8px 20px 4px; }

.sheet-header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}
.sheet-title {
  font-family: var(--ff-serif);
  font-size: 24px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.01em;
}
.auto-row {
  display: flex;
  align-items: center;
  gap: 9px;
}
.auto-label {
  font-size: 12px;
  color: rgba(29,36,28,.5);
  font-weight: 500;
}
.toggle {
  width: 44px;
  height: 25px;
  border-radius: 13px;
  background: rgba(29,36,28,.14);
  border: none;
  cursor: pointer;
  position: relative;
  transition: background 0.2s;
  flex-shrink: 0;
  -webkit-appearance: none;
}
.toggle.on { background: var(--leaf); }
.toggle-thumb {
  width: 21px;
  height: 21px;
  border-radius: 50%;
  background: white;
  position: absolute;
  top: 2px;
  left: 2px;
  transition: left 0.2s;
  box-shadow: 0 1px 4px rgba(0,0,0,.2);
}
.toggle.on .toggle-thumb { left: 21px; }

.zone-row {
  display: flex;
  align-items: center;
  padding: 14px 8px;
  border-bottom: 1px solid rgba(29,36,28,.06);
  cursor: pointer;
  gap: 14px;
  border-radius: 8px;
  margin: 0 -8px;
  transition: background 0.12s;
}
.zone-row:last-child { border-bottom: none; }
.zone-row:active { background: rgba(29,36,28,.05); }

.zone-indicator {
  width: 3px;
  height: 38px;
  border-radius: 2px;
  background: rgba(29,36,28,.1);
  flex-shrink: 0;
  transition: background 0.2s;
}
.zone-row.active .zone-indicator { background: var(--leaf); }

.zone-row-info { flex: 1; min-width: 0; }
.zone-row-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 3px;
  transition: color 0.15s;
}
.zone-row.active .zone-row-name { color: var(--leaf); }
.zone-row-time {
  font-size: 11px;
  color: rgba(29,36,28,.42);
}
.zone-row-bpm {
  font-size: 11px;
  color: rgba(29,36,28,.35);
  text-align: right;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}
.zone-check {
  opacity: 0;
  flex-shrink: 0;
  transition: opacity 0.15s;
  color: var(--leaf);
}
.zone-row.active .zone-check { opacity: 1; }

.sheet-footer {
  padding: 16px 0 4px;
  display: flex;
  justify-content: center;
}
.csv-btn {
  font-size: 11px;
  color: rgba(29,36,28,.32);
  background: none;
  border: 1px solid rgba(29,36,28,.1);
  border-radius: 8px;
  padding: 7px 14px;
  cursor: pointer;
  font-family: var(--ff-sans);
  transition: color 0.15s;
  -webkit-appearance: none;
}
.csv-btn:active { color: var(--ink); }
</style>
</head>
<body>

<div class="page">
  <div class="card">
    <!-- 上部バー -->
    <div class="topbar">
      <div class="topbar-left">
        <button class="zone-pill" id="zonePill" onclick="openSheet()">
          <span class="pill-dot"></span>
          <span class="pill-text" id="pillText">ZONE 1 · Deep Work</span>
          <svg class="pill-chevron" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>
        <span class="mode-badge" id="modeBadge">自動</span>
      </div>
      <span class="clock" id="clockEl">00:00</span>
    </div>

    <!-- プレイヤー本体 -->
    <div class="player-main">
      <!-- ビニールレコード -->
      <div class="vinyl-wrap">
        <div class="vinyl" id="vinyl">
          <div class="vinyl-label" id="vinylLabel">
            <div class="label-text">
              <div class="label-name">VEGEKUL MUSIC</div>
            </div>
          </div>
          <div class="vinyl-spindle"></div>
        </div>
      </div>

      <!-- BPM -->
      <div class="bpm-section">
        <div class="bpm-row">
          <span class="bpm-num" id="npBpm">—</span>
          <span class="bpm-unit">BPM</span>
        </div>
        <div class="bpm-label">Instrumental</div>
      </div>

      <!-- プログレスバー -->
      <div class="progress-section">
        <div class="prog-bar" id="progBar" onclick="seekTo(event)">
          <div class="prog-fill" id="progFill"></div>
        </div>
        <div class="time-row">
          <span id="timeEl">0:00</span>
          <span id="timeDu">—</span>
        </div>
      </div>

      <!-- コントロール -->
      <div class="controls">
        <button class="ctrl-btn" onclick="prevTrack()" aria-label="前の曲">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/>
          </svg>
        </button>
        <button class="play-btn" id="playBtn" onclick="togglePlay()" aria-label="再生/停止">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        </button>
        <button class="ctrl-btn" onclick="nextTrack()" aria-label="次の曲">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/>
          </svg>
        </button>
        <button class="ctrl-btn like-btn" id="likeBtn" onclick="toggleLike()" aria-label="いいね">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- シートオーバーレイ -->
<div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()"></div>

<!-- ゾーン選択シート -->
<div class="zone-sheet" id="zoneSheet">
  <div class="sheet-handle-wrap"><div class="sheet-handle"></div></div>
  <div class="sheet-inner">
    <div class="sheet-header-row">
      <span class="sheet-title">Zone</span>
      <div class="auto-row">
        <span class="auto-label">時間帯で自動</span>
        <button class="toggle" id="autoToggle" onclick="toggleAutoZone()">
          <div class="toggle-thumb"></div>
        </button>
      </div>
    </div>
    <div id="zoneList"></div>
    <div class="sheet-footer">
      <button class="csv-btn" onclick="exportCSV()">ログをCSVで書き出す</button>
    </div>
  </div>
</div>

<script>
// === 再生ログ ===
const LOG_KEY = 'ku_play_log'
const UNSENT_KEY = 'ku_log_unsent'
const AUTO_KEY = 'ku_auto_zone'
const LIKES_KEY = 'ku_likes'
const LOG_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzqjkNW9i3k5pwq53MEZdZjXWn-HPV-UuZpPaSi4Ubi2lra-PH97dy-9oNtlFNKq3aXwg/exec'
const MAX_LOG_ENTRIES = 10000
let trackEndedNaturally = false

// 端末ID: 初回生成してlocalStorageに永続化
const getDeviceId = () => {
  let id = localStorage.getItem('ku_device_id')
  if (!id) {
    id = 'dev_' + Math.random().toString(36).slice(2, 8) + Math.random().toString(36).slice(2, 8)
    localStorage.setItem('ku_device_id', id)
  }
  return id
}
const device_id = getDeviceId()

let isFlushing = false

const flushLogs = async () => {
  if (isFlushing) return
  let unsent
  try { unsent = JSON.parse(localStorage.getItem(UNSENT_KEY) || '[]') } catch (_) { return }
  if (!unsent.length) return
  isFlushing = true
  const batch = unsent.slice()
  try {
    const res = await fetch(LOG_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ device_id, events: batch })
    })
    if (res.ok) {
      try {
        const remaining = JSON.parse(localStorage.getItem(UNSENT_KEY) || '[]')
        localStorage.setItem(UNSENT_KEY, JSON.stringify(remaining.slice(batch.length)))
      } catch (_) {}
    }
  } catch (_) {}
  isFlushing = false
}

const logEvent = (type, extra = {}) => {
  const now = new Date()
  const track = queue[idx] || {}
  const entry = { type, ts: now.toISOString(), hour: now.getHours(), zone: currentZone, title: track.title || '', ...extra }
  try {
    const logs = JSON.parse(localStorage.getItem(LOG_KEY) || '[]')
    logs.push(entry)
    if (logs.length > MAX_LOG_ENTRIES) logs.splice(0, logs.length - MAX_LOG_ENTRIES)
    localStorage.setItem(LOG_KEY, JSON.stringify(logs))
  } catch (_) {}
  try {
    const unsent = JSON.parse(localStorage.getItem(UNSENT_KEY) || '[]')
    unsent.push(entry)
    localStorage.setItem(UNSENT_KEY, JSON.stringify(unsent))
    if (unsent.length >= 10) flushLogs()
  } catch (_) {}
}

const exportCSV = () => {
  let logs
  try { logs = JSON.parse(localStorage.getItem(LOG_KEY) || '[]') } catch (_) { logs = [] }
  if (!logs.length) { alert('ログがありません'); return }
  const cols = ['type', 'ts', 'hour', 'zone', 'title', 'track_id', 'elapsed', 'duration', 'fromZone', 'toZone']
  const rows = [cols.join(',')]
  logs.forEach(e => rows.push(cols.map(c => e[c] ?? '').join(',')))
  const blob = new Blob(['﻿' + rows.join('\n')], { type: 'text/csv;charset=utf-8;' })
  const a = document.createElement('a')
  a.href = URL.createObjectURL(blob)
  a.download = 'ku_play_log_' + new Date().toISOString().slice(0, 10) + '.csv'
  document.body.appendChild(a)
  a.click()
  document.body.removeChild(a)
}

// === いいね ===
const getLikes = () => {
  try { return new Set(JSON.parse(localStorage.getItem(LIKES_KEY) || '[]')) } catch (_) { return new Set() }
}
const saveLikes = (likes) => {
  try { localStorage.setItem(LIKES_KEY, JSON.stringify([...likes])) } catch (_) {}
}
const updateLikeBtn = () => {
  const track = queue[idx] || {}
  const liked = getLikes().has(track.title)
  const btn = document.getElementById('likeBtn')
  btn.classList.toggle('liked', liked)
  btn.innerHTML = liked
    ? '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>'
    : '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>'
}
const toggleLike = () => {
  const track = queue[idx] || {}
  if (!track.title) return
  const likes = getLikes()
  if (likes.has(track.title)) {
    likes.delete(track.title)
    logEvent('unlike', { track_id: track.title })
  } else {
    likes.add(track.title)
    logEvent('like', { track_id: track.title })
  }
  saveLikes(likes)
  updateLikeBtn()
}

// === 時間帯からゾーンを判定 ===
const getAutoZone = () => {
  const h = new Date().getHours()
  if (h >= 8 && h < 13) return 1
  if (h >= 13 && h < 19) return 2
  if (h >= 19 || h < 1)  return 3
  return 4
}

// === 状態 ===
const savedAuto = localStorage.getItem(AUTO_KEY)
let autoZone = savedAuto === null ? true : savedAuto === 'true'
let currentZone = autoZone ? getAutoZone() : 1
let queue = [], idx = 0, shuffle = true, playing = false
const audio = new Audio()

// === 時計 ===
const updateClock = () => {
  const n = new Date()
  document.getElementById('clockEl').textContent =
    String(n.getHours()).padStart(2, '0') + ':' + String(n.getMinutes()).padStart(2, '0')
}
setInterval(updateClock, 1000)
updateClock()

// === ピル・シート表示更新 ===
const updatePill = () => {
  const m = ZONE_META[currentZone]
  document.getElementById('pillText').textContent = m.name + ' · ' + m.label
  document.getElementById('modeBadge').textContent = autoZone ? '自動' : '手動'
  document.getElementById('autoToggle').classList.toggle('on', autoZone)
}

const renderZoneList = () => {
  document.getElementById('zoneList').innerHTML = Object.entries(ZONE_META).map(([z, m]) => `
    <div class="zone-row ${parseInt(z) === currentZone ? 'active' : ''}" onclick="selectZone(${z})">
      <div class="zone-indicator"></div>
      <div class="zone-row-info">
        <div class="zone-row-name">${m.name} · ${m.label}</div>
        <div class="zone-row-time">${m.time}</div>
      </div>
      <div class="zone-row-bpm">${m.bpm}</div>
      <svg class="zone-check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
  `).join('')
}

// === シート開閉 ===
const openSheet = () => {
  renderZoneList()
  document.getElementById('sheetOverlay').classList.add('open')
  document.getElementById('zoneSheet').classList.add('open')
}
const closeSheet = () => {
  document.getElementById('sheetOverlay').classList.remove('open')
  document.getElementById('zoneSheet').classList.remove('open')
}

const selectZone = (z) => {
  autoZone = false
  localStorage.setItem(AUTO_KEY, 'false')
  switchZone(z)
  closeSheet()
}

const toggleAutoZone = () => {
  autoZone = !autoZone
  localStorage.setItem(AUTO_KEY, String(autoZone))
  if (autoZone) {
    const z = getAutoZone()
    if (z !== currentZone) switchZone(z)
  }
  updatePill()
  renderZoneList()
}

// === アルバムアート ===
let currentArtUrl = null

const loadAlbumArt = (filePath) => {
  if (currentArtUrl) { URL.revokeObjectURL(currentArtUrl); currentArtUrl = null }
  const label = document.getElementById('vinylLabel')
  label.classList.remove('has-art')
  label.style.backgroundImage = ''
  if (typeof jsmediatags === 'undefined') return
  try {
    jsmediatags.read(filePath, {
      onSuccess: (tag) => {
        const pic = tag.tags && tag.tags.picture
        if (!pic || !pic.data) return
        const blob = new Blob([new Uint8Array(pic.data)], { type: pic.format || 'image/jpeg' })
        currentArtUrl = URL.createObjectURL(blob)
        label.style.backgroundImage = `url(${currentArtUrl})`
        label.classList.add('has-art')
      },
      onError: () => {},
    })
  } catch (_) {}
}

// === audio イベント ===
audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return
  document.getElementById('progFill').style.width = Math.round((audio.currentTime / audio.duration) * 100) + '%'
  document.getElementById('timeEl').textContent = fmt(Math.floor(audio.currentTime))
  document.getElementById('timeDu').textContent = fmt(Math.floor(audio.duration))
})
audio.addEventListener('ended', () => {
  trackEndedNaturally = true
  logEvent('track_complete', { elapsed: Math.floor(audio.duration || 0), duration: Math.floor(audio.duration || 0) })
  nextTrack()
})

// === キュー ===
const buildQueue = (zone) => {
  let t = ZONES[zone].map((tr, i) => ({ ...tr, num: i + 1 }))
  if (shuffle) for (let i = t.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [t[i], t[j]] = [t[j], t[i]] }
  return t
}

const switchZone = (zone) => {
  logEvent('zone_switch', { fromZone: currentZone, toZone: zone })
  if (playing) logEvent('skip', { elapsed: Math.floor(audio.currentTime), duration: Math.floor(audio.duration || 0) })
  currentZone = zone
  queue = buildQueue(zone)
  idx = 0
  const wasPlaying = playing
  playing = false
  audio.pause()
  load(0)
  if (wasPlaying) { audio.play().then(() => { playing = true; setIcon(true); logEvent('play_start') }).catch(() => {}) }
  updatePill()
  renderZoneList()
}

const load = (i) => {
  const t = queue[i]
  audio.src = t.file
  audio.load()
  // BPMをファイル名から抽出。取得できない場合はデータのbpmフィールドから数値のみ取り出す
  const bpmMatch = t.file.match(/_(\d+)bpm/i)
  document.getElementById('npBpm').textContent = bpmMatch ? bpmMatch[1] : (t.bpm || '').replace(/\D/g, '')
  document.getElementById('progFill').style.width = '0%'
  document.getElementById('timeEl').textContent = '0:00'
  document.getElementById('timeDu').textContent = '—'
  loadAlbumArt(t.file)
  updateLikeBtn()
}

const togglePlay = () => {
  if (playing) {
    audio.pause()
    playing = false
    setIcon(false)
    logEvent('play_stop', { elapsed: Math.floor(audio.currentTime), duration: Math.floor(audio.duration || 0) })
  } else {
    audio.play().then(() => { playing = true; setIcon(true); logEvent('play_start') }).catch(() => {})
  }
}

const nextTrack = () => {
  if (!trackEndedNaturally && (playing || audio.currentTime > 0)) {
    logEvent('skip', { elapsed: Math.floor(audio.currentTime), duration: Math.floor(audio.duration || 0) })
  }
  trackEndedNaturally = false
  idx = (idx + 1) % queue.length
  load(idx)
  if (playing) audio.play().then(() => logEvent('play_start')).catch(() => {})
}

const prevTrack = () => {
  if (audio.currentTime > 3) { audio.currentTime = 0; return }
  if (playing || audio.currentTime > 0) {
    logEvent('skip', { elapsed: Math.floor(audio.currentTime), duration: Math.floor(audio.duration || 0) })
  }
  idx = (idx - 1 + queue.length) % queue.length
  load(idx)
  if (playing) audio.play().then(() => logEvent('play_start')).catch(() => {})
}

const seekTo = (e) => {
  if (!audio.duration) return
  const r = e.currentTarget.getBoundingClientRect()
  audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration
}

const toggleShuffle = () => {
  shuffle = !shuffle
  const cur = queue[idx].file
  queue = buildQueue(currentZone)
  idx = queue.findIndex(t => t.file === cur)
}

const jumpTo = (i) => {
  if (i !== idx && (playing || audio.currentTime > 0)) {
    logEvent('skip', { elapsed: Math.floor(audio.currentTime), duration: Math.floor(audio.duration || 0) })
  }
  idx = i
  load(idx)
  playing = true
  audio.play().then(() => { logEvent('play_start'); setIcon(true) }).catch(() => {})
}

const setIcon = (p) => {
  document.getElementById('playBtn').innerHTML = p
    ? '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>'
    : '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>'
  document.getElementById('vinyl').classList.toggle('playing', p)
}

const fmt = (s) => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0')

// === 初期化 ===
queue = buildQueue(currentZone)
load(0)
updatePill()

// 60秒ごとに未送信ログを送信
setInterval(flushLogs, 60000)
// ページ離脱・バックグラウンド化で取りこぼさない
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushLogs() })
</script>
